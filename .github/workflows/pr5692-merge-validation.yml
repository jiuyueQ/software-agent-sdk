name: PR5692 merge validation
on:
  push:
    branches: [ci/pr5692-merge-validation-20261123]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.13'
      - run: uv sync --frozen --dev
      - name: File checks
        run: uv run --no-sync pre-commit run --files openhands-sdk/openhands/sdk/agent/acp_agent.py tests/sdk/agent/test_acp_agent.py
      - name: ACP and session accounting regression suites
        run: >-
          uv run --no-sync pytest tests/sdk/agent/test_acp_agent.py
          tests/sdk/llm/test_llm_metrics.py tests/sdk/llm/test_llm_session.py
          tests/sdk/llm/test_llm_fallback_sessions.py tests/sdk/llm/test_llm_telemetry.py
          -q --timeout=60
      - name: Real offline ACP subprocess
        run: |
          uv run --no-sync python .pr/reproduce_acp_context_usage.py --expected-context 46000
          uv run --no-sync python .pr/reproduce_acp_context_usage.py --context-updates 46000 0 --expected-context 0
          uv run --no-sync python .pr/reproduce_acp_context_usage.py --context-updates 46000 0 12000 --expected-context 12000
